[package]
name = "crafter-repo"
version = "0.1.0"
description = "Crafter - Agente de Chat Ligero para Linux"
authors = ["Bryan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sysinfo = "0.30"
dirs-next = "2.0"
base64 = "0.22"





