[package]
name = "stark"
version = "0.1.0"
description = "Crafter - Agente de Chat Ligero para Linux"
authors = ["Bryan"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sysinfo = "0.30"
dirs-next = "2.0"
base64 = "0.22"
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
keyring = "3"
pdf-extract = "0.7"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-javascript = "0.21"


[dev-dependencies]
wiremock = "0.6"





